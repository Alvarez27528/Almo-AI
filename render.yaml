services:
  - type: web
    name: almo-ai
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: APP_URL
        sync: false
