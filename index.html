<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="ALMO AI — tu asesor financiero personal con inteligencia artificial. Controla gastos, inversiones y objetivos con una experiencia minimalista y segura." />
    <meta name="theme-color" content="#050505" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ALMO AI" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:title" content="ALMO AI — Finanzas personales inteligentes" />
    <meta property="og:description" content="Asesor financiero con IA. Minimalista, privado y seguro." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23fff'/%3E%3Cpath d='M32 14 12 26h40L32 14Zm-16 16v14h6V30h-6Zm13 0v14h6V30h-6Zm13 0v14h6V30h-6ZM12 48v4h40v-4H12Z' fill='%23000'/%3E%3C/svg%3E" />
    <title>ALMO AI — Finanzas inteligentes</title>
    <style>
      html, body { touch-action: manipulation; background: #050505; }
      /* Splash shown until React hydrates: avoids white flash */
      #root:empty::before {
        content: '';
        position: fixed; inset: 0;
        background: #050505;
      }
    </style>
    <script>
      document.addEventListener('touchstart', function (event) {
        if (event.touches.length > 1) event.preventDefault();
      }, { passive: false });
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function (event) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) event.preventDefault();
        lastTouchEnd = now;
      }, false);
    </script>
  </head>
  <body>
    <noscript>ALMO AI necesita JavaScript para funcionar.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
